<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kisan Anaj Bazaar - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6f4;
  color:#222;
}

header{
  background:#176b2e;
  color:white;
  padding:20px 15px;
  text-align:center;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}

input,
select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  border:0;
  padding:11px 15px;
  border-radius:8px;
  cursor:pointer;
  margin-top:7px;
}

.login-btn{
  width:100%;
  background:#176b2e;
  color:white;
}

.logout-btn{
  background:#d32f2f;
  color:white;
}

.order{
  border:1px solid #ddd;
  padding:15px;
  margin:12px 0;
  border-radius:10px;
}

.order h3{
  color:#176b2e;
  margin-bottom:8px;
}

.order-item{
  background:#f5f5f5;
  padding:8px;
  margin:5px 0;
  border-radius:6px;
}

.status{
  font-weight:bold;
  margin:8px 0;
}

.product{
  border:1px solid #ddd;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
}

.product img{
  width:120px;
  height:90px;
  object-fit:cover;
  border-radius:8px;
}

.hidden{
  display:none;
}

.error{
  background:#ffe0e0;
  color:#a00000;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}

.success{
  background:#ddf5df;
  color:#176b2e;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}

.admin-content{
  display:none;
}
</style>
</head>

<body>

<header>
  <h1>🌾 Kisan Anaj Bazaar</h1>
  <p>Admin Panel</p>
</header>

<div class="container">

<!-- LOGIN -->

<div id="loginBox" class="card">

  <h2>🔐 Admin Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button
    class="login-btn"
    onclick="adminLogin()"
  >
    Login
  </button>

  <div id="loginMessage"></div>

</div>


<!-- ADMIN PANEL -->

<div
  id="adminContent"
  class="admin-content"
>

  <div class="card">

    <h2>⚙️ Admin Dashboard</h2>

    <button
      class="logout-btn"
      onclick="adminLogout()"
    >
      Logout
    </button>

  </div>


  <!-- ORDERS -->

  <div class="card">

    <h2>📦 Customer Orders</h2>

    <div id="orders">
      Orders लोड हो रहे हैं...
    </div>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>🌾 Products</h2>

    <div id="products">
      Products लोड हो रहे हैं...
    </div>

  </div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  update,
  remove
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "PASTE_API_KEY",

  authDomain:
    "kissan-bajar.firebaseapp.com",

  databaseURL:
    "https://kissan-bajar-default-rtdb.firebaseio.com",

  projectId:
    "kissan-bajar",

  storageBucket:
    "kissan-bajar.firebasestorage.app",

  messagingSenderId:
    "PASTE_MESSAGING_SENDER_ID",

  appId:
    "PASTE_APP_ID"

};


/* =========================
   FIREBASE
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getDatabase(app);


/* =========================
   ADMIN EMAIL
========================= */

/*
  यहां अपना Firebase Admin email डालना है।
*/

const ADMIN_EMAIL =
  "PASTE_ADMIN_EMAIL";


/* =========================
   LOGIN
========================= */

window.adminLogin =
async function(){

  const email =
    document
    .getElementById("email")
    .value
    .trim();

  const password =
    document
    .getElementById("password")
    .value;


  if(!email || !password){

    showLoginMessage(
      "Email और Password डालें।",
      true
    );

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    showLoginMessage(
      "Login failed: " +
      error.message,
      true
    );

  }

};


/* =========================
   LOGOUT
========================= */

window.adminLogout =
async function(){

  await signOut(auth);

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      /*
        Admin email check
      */

      if(
        user.email !== ADMIN_EMAIL
      ){

        showLoginMessage(
          "यह account Admin नहीं है।",
          true
        );

        signOut(auth);

        return;

      }


      document
      .getElementById("loginBox")
      .style.display = "none";


      document
      .getElementById("adminContent")
      .style.display = "block";


      loadOrders();

      loadProducts();

    }else{

      document
      .getElementById("loginBox")
      .style.display = "block";


      document
      .getElementById("adminContent")
      .style.display = "none";

    }

  }
);


/* =========================
   LOAD ORDERS
========================= */

async function loadOrders(){

  const box =
    document.getElementById("orders");

  box.innerHTML =
    "Orders लोड हो रहे हैं...";


  try{

    const snapshot =
      await get(
        ref(db,"orders")
      );


    if(!snapshot.exists()){

      box.innerHTML =
        "<p>अभी कोई order नहीं आया।</p>";

      return;

    }


    const orders =
      snapshot.val();


    box.innerHTML = "";


    const entries =
      Object.entries(orders)
      .sort(
        (a,b)=>
          Number(b[1].createdAt || 0)
          -
          Number(a[1].createdAt || 0)
      );


    entries.forEach(
      ([id,order])=>{

        const div =
          document.createElement("div");

        div.className =
          "order";


        const date =
          order.createdAt
          ?
          new Date(
            order.createdAt
          ).toLocaleString("hi-IN")
          :
          "N/A";


        let itemsHtml = "";


        if(
          Array.isArray(order.items)
        ){

          order.items.forEach(
            item=>{

              itemsHtml += `

                <div class="order-item">

                  <strong>
                    ${escapeHtml(item.name || "")}
                  </strong>

                  <br>

                  मात्रा:
                  ${Number(item.quantity || 0)} kg

                  <br>

                  कीमत:
                  ₹${Number(item.price || 0)}/kg

                  <br>

                  कुल:
                  ₹${Number(item.total || 0)}

                </div>

              `;

            }
          );

        }


        div.innerHTML = `

          <h3>
            📦 Order ID:
            ${escapeHtml(id)}
          </h3>

          <p>
            <strong>ग्राहक:</strong>
            ${escapeHtml(order.customerName || "")}
          </p>

          <p>
            <strong>मोबाइल:</strong>
            ${escapeHtml(order.customerPhone || "")}
          </p>

          <p>
            <strong>पता:</strong>
            ${escapeHtml(order.customerAddress || "")}
          </p>

          <p>
            <strong>Order Time:</strong>
            ${date}
          </p>

          <div>
            ${itemsHtml}
          </div>

          <p>
            <strong>
              कुल राशि:
              ₹${Number(order.total || 0)}
            </strong>
          </p>

          <p class="status">
            Status:
            ${escapeHtml(order.status || "pending")}
          </p>

          <select
            onchange="changeOrderStatus(
              '${id}',
              this.value
            )"
          >

            <option
              value="pending"
              ${order.status === "pending" ? "selected" : ""}
            >
              Pending
            </option>

            <option
              value="confirmed"
              ${order.status === "confirmed" ? "selected" : ""}
            >
              Confirmed
            </option>

            <option
              value="packed"
              ${order.status === "packed" ? "selected" : ""}
            >
              Packed
            </option>

            <option
              value="delivered"
              ${order.status === "delivered" ? "selected" : ""}
            >
              Delivered
            </option>

            <option
              value="cancelled"
              ${order.status === "cancelled" ? "selected" : ""}
            >
              Cancelled
            </option>

          </select>

        `;


        box.appendChild(div);

      }
    );


  }catch(error){

    console.error(error);

    box.innerHTML =
      `<div class="error">
        Orders load नहीं हुए।
        Firebase Rules जांचें।
      </div>`;

  }

}


/* =========================
   CHANGE ORDER STATUS
========================= */

window.changeOrderStatus =
async function(orderId,status){

  try{

    await update(
      ref(
        db,
        "orders/" + orderId
      ),
      {
        status:status,
        updatedAt:Date.now()
      }
    );


    alert(
      "✅ Order status बदल दिया गया।"
    );


    loadOrders();


  }catch(error){

    console.error(error);

    alert(
      "❌ Status update नहीं हुआ।"
    );

  }

};


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const box =
    document.getElementById("products");

  box.innerHTML =
    "Products लोड हो रहे हैं...";


  try{

    const snapshot =
      await get(
        ref(db,"products")
      );


    if(!snapshot.exists()){

      box.innerHTML =
        "<p>कोई product नहीं है।</p>";

      return;

    }


    const products =
      snapshot.val();


    box.innerHTML = "";


    Object.entries(products)
    .forEach(
      ([id,product])=>{

        const div =
          document.createElement("div");

        div.className =
          "product";


        div.innerHTML = `

          <div>

            ${
              product.imageUrl
              ?
              `<img
                src="${product.imageUrl}"
                alt="Product"
              >`
              :
              ""
            }

          </div>

          <h3>
            ${escapeHtml(product.name || "")}
          </h3>

          <p>
            Category:
            ${escapeHtml(product.category || "")}
          </p>

          <p>
            Price:
            ₹${Number(product.price || 0)}/kg
          </p>

          <p>
            Quantity:
            ${Number(product.quantity || 0)} kg
          </p>

          <p>
            Farmer:
            ${escapeHtml(product.farmer || "")}
          </p>

          <p>
            Location:
            ${escapeHtml(product.location || "")}
          </p>

          <p>
            Status:
            ${escapeHtml(product.status || "")}
          </p>

          <button
            onclick="toggleProduct(
              '${id}',
              '${product.status === "hidden" ? "active" : "hidden"}'
            )"
          >
            ${
              product.status === "hidden"
              ?
              "👁️ Show Product"
              :
              "🙈 Hide Product"
            }
          </button>

          <button
            style="background:#d32f2f;color:white"
            onclick="deleteProduct('${id}')"
          >
            🗑️ Delete
          </button>

        `;


        box.appendChild(div);

      }
    );


  }catch(error){

    console.error(error);

    box.innerHTML =
      `<div class="error">
        Products load नहीं हुए।
      </div>`;

  }

}


/* =========================
   HIDE / SHOW PRODUCT
========================= */

window.toggleProduct =
async function(id,status){

  try{

    await update(
      ref(
        db,
        "products/" + id
      ),
      {
        status:status
      }
    );


    alert(
      "✅ Product status बदल दिया गया।"
    );


    loadProducts();


  }catch(error){

    console.error(error);

    alert(
      "❌ Product update नहीं हुआ।"
    );

  }

};


/* =========================
   DELETE PRODUCT
========================= */

window.deleteProduct =
async function(id){

  const ok =
    confirm(
      "क्या आप यह product delete करना चाहते हैं?"
    );


  if(!ok){

    return;

  }


  try{

    await remove(
      ref(
        db,
        "products/" + id
      )
    );


    alert(
      "✅ Product delete हो गया।"
    );


    loadProducts();


  }catch(error){

    console.error(error);

    alert(
      "❌ Product delete नहीं हुआ।"
    );

  }

};


/* =========================
   MESSAGE
========================= */

function showLoginMessage(
  message,
  error=false
){

  const box =
    document.getElementById(
      "loginMessage"
    );


  box.className =
    error
    ?
    "error"
    :
    "success";


  box.innerText =
    message;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>

</body>
</html>
