<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kisan Anaj Bazaar</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7f2;
  color:#222;
}

header{
  background:#1b7a35;
  color:white;
  padding:18px 12px;
  text-align:center;
}

header h1{
  font-size:26px;
}

header p{
  margin-top:6px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.search-box{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 8px #0001;
}

.search-box input,
.search-box select,
form input,
form select,
form textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

button{
  border:0;
  padding:11px 15px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
}

.search-btn{
  background:#1976d2;
  color:white;
}

.section{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 8px #0001;
}

.section h2{
  margin-bottom:15px;
  color:#176b2e;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.product{
  border:1px solid #ddd;
  border-radius:12px;
  overflow:hidden;
  background:white;
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:12px;
}

.product h3{
  margin-bottom:7px;
}

.price{
  color:#d35400;
  font-weight:bold;
  font-size:18px;
}

.product button{
  width:100%;
  margin-top:10px;
  background:#1b7a35;
  color:white;
}

form button{
  width:100%;
  background:#1b7a35;
  color:white;
  margin-top:10px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding:10px 0;
  gap:10px;
}

.remove{
  background:#d32f2f;
  color:white;
}

.total{
  font-size:20px;
  font-weight:bold;
  margin-top:15px;
}

.message{
  padding:10px;
  border-radius:8px;
  margin:10px 0;
  display:none;
}

.success{
  background:#d9f7df;
  color:#176b2e;
}

.error{
  background:#ffe0e0;
  color:#b00020;
}

footer{
  text-align:center;
  padding:25px;
  background:#163d20;
  color:white;
  margin-top:30px;
}

.loading{
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header>
  <h1>🌾 Kisan Anaj Bazaar</h1>
  <p>किसानों से सीधे कृषि सामान खरीदें और अपना सामान बेचें</p>
</header>

<div class="container">

<!-- SEARCH -->
<div class="search-box">

  <input
    type="text"
    id="searchInput"
    placeholder="🔎 जैसे धान, गेहूं, मक्का..."
  >

  <select id="categoryFilter">
    <option value="">सभी सामान</option>
    <option value="धान">धान</option>
    <option value="गेहूं">गेहूं</option>
    <option value="मक्का">मक्का</option>
    <option value="दलहन">दलहन</option>
    <option value="सब्जी">सब्जी</option>
    <option value="अन्य">अन्य</option>
  </select>

  <button class="search-btn" onclick="loadProducts()">
    🔎 सामान खोजें
  </button>

</div>


<!-- PRODUCTS -->

<div class="section">

  <h2>🌾 उपलब्ध कृषि सामान</h2>

  <div id="message" class="message"></div>

  <div id="products" class="products">
    <div class="loading">
      सामान लोड हो रहा है...
    </div>
  </div>

</div>


<!-- SELL -->

<div class="section">

<h2>🚜 अपना सामान बेचें</h2>

<form id="sellForm">

<input
  type="text"
  id="productName"
  placeholder="सामान का नाम जैसे धान"
  required
>

<select id="productCategory" required>

<option value="">कैटेगरी चुनें</option>
<option value="धान">धान</option>
<option value="गेहूं">गेहूं</option>
<option value="मक्का">मक्का</option>
<option value="दलहन">दलहन</option>
<option value="सब्जी">सब्जी</option>
<option value="अन्य">अन्य</option>

</select>

<input
  type="number"
  id="price"
  placeholder="कीमत ₹/kg"
  min="1"
  required
>

<input
  type="number"
  id="quantity"
  placeholder="कुल मात्रा kg"
  min="1"
  required
>

<input
  type="text"
  id="farmer"
  placeholder="किसान का नाम"
  required
>

<input
  type="tel"
  id="phone"
  placeholder="10 अंकों का मोबाइल नंबर"
  maxlength="10"
  required
>

<input
  type="text"
  id="location"
  placeholder="गांव / शहर / जिला"
  required
>

<input
  type="file"
  id="productImage"
  accept="image/*"
  required
>

<textarea
  id="description"
  rows="4"
  placeholder="सामान के बारे में जानकारी"
></textarea>

<button type="submit">
  📤 सामान पोस्ट करें
</button>

</form>

</div>


<!-- CART -->

<div class="section">

<h2>🛒 आपका Cart</h2>

<div id="cart">
  Cart अभी खाली है।
</div>

<div class="total">
  कुल: ₹<span id="cartTotal">0</span>
</div>

</div>


<!-- ORDER -->

<div class="section">

<h2>📦 ऑर्डर भेजें</h2>

<form id="orderForm">

<input
  type="text"
  id="customerName"
  placeholder="ग्राहक का नाम"
  required
>

<input
  type="tel"
  id="customerPhone"
  placeholder="ग्राहक मोबाइल नंबर"
  maxlength="10"
  required
>

<textarea
  id="customerAddress"
  rows="4"
  placeholder="पूरा पता"
  required
></textarea>

<button type="submit">
  ✅ ऑर्डर भेजें
</button>

</form>

</div>

</div>


<footer>
© 2026 Kisan Anaj Bazaar
</footer>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  get,
  update
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import {
  getStorage,
  ref as storageRef,
  uploadBytes,
  getDownloadURL
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey: "PASTE_API_KEY",

  authDomain: "kissan-bajar.firebaseapp.com",

  databaseURL:
  "https://kissan-bajar-default-rtdb.firebaseio.com",

  projectId: "kissan-bajar",

  storageBucket:
  "kissan-bajar.firebasestorage.app",

  messagingSenderId:
  "PASTE_MESSAGING_SENDER_ID",

  appId:
  "PASTE_APP_ID"

};


/* =========================
   FIREBASE START
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

const storage = getStorage(app);

let currentUser = null;

let cart = [];


/* =========================
   ANONYMOUS LOGIN
========================= */

async function loginUser(){

  try{

    const result =
      await signInAnonymously(auth);

    currentUser = result.user;

    console.log(
      "User Login:",
      currentUser.uid
    );

    loadProducts();

  }catch(error){

    console.error(error);

    showMessage(
      "Firebase login नहीं हुआ। Firebase Authentication में Anonymous Login चालू करें।",
      true
    );

  }

}


/* =========================
   MESSAGE
========================= */

function showMessage(text,error=false){

  const box =
    document.getElementById("message");

  box.innerText = text;

  box.style.display = "block";

  box.className =
    "message " +
    (error ? "error" : "success");

  setTimeout(()=>{

    box.style.display = "none";

  },5000);

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const container =
    document.getElementById("products");

  container.innerHTML =
    '<div class="loading">सामान लोड हो रहा है...</div>';

  try{

    const snapshot =
      await get(ref(db,"products"));

    if(!snapshot.exists()){

      container.innerHTML =
        "<p>अभी कोई सामान उपलब्ध नहीं है।</p>";

      return;

    }

    const data =
      snapshot.val();

    const search =
      document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

    const category =
      document
      .getElementById("categoryFilter")
      .value;

    container.innerHTML = "";

    let found = 0;

    Object.entries(data).forEach(
      ([id,product])=>{

        if(product.status === "hidden"){
          return;
        }

        const name =
          String(product.name || "")
          .toLowerCase();

        const productCategory =
          product.category || "";

        if(
          search &&
          !name.includes(search)
        ){
          return;
        }

        if(
          category &&
          productCategory !== category
        ){
          return;
        }

        found++;

        const card =
          document.createElement("div");

        card.className = "product";

        const image =
          product.imageUrl ||
          "https://via.placeholder.com/500x350?text=Kisan+Anaj+Bazaar";

        card.innerHTML = `

          <img
            src="${image}"
            alt="${escapeHtml(product.name || "सामान")}"
          >

          <div class="product-info">

            <h3>
              ${escapeHtml(product.name || "")}
            </h3>

            <p>
              कैटेगरी:
              ${escapeHtml(product.category || "")}
            </p>

            <p class="price">
              ₹${Number(product.price || 0)}/kg
            </p>

            <p>
              उपलब्ध मात्रा:
              ${Number(product.quantity || 0)} kg
            </p>

            <p>
              👨‍🌾 किसान:
              ${escapeHtml(product.farmer || "")}
            </p>

            <p>
              📍 ${escapeHtml(product.location || "")}
            </p>

            <button
              onclick='addToCart(${JSON.stringify({
                id:id,
                name:product.name,
                price:Number(product.price || 0),
                quantity:Number(product.quantity || 0),
                farmer:product.farmer || "",
                farmerPhone:product.phone || ""
              })})'
            >
              🛒 Cart में डालें
            </button>

          </div>

        `;

        container.appendChild(card);

      }
    );

    if(found === 0){

      container.innerHTML =
        "<p>इस खोज के अनुसार कोई सामान नहीं मिला।</p>";

    }

  }catch(error){

    console.error(error);

    container.innerHTML =
      "<p>सामान लोड नहीं हो सका। Firebase Database और Rules जांचें।</p>";

  }

}


/* =========================
   ADD CART
========================= */

window.addToCart = function(product){

  const existing =
    cart.find(item => item.id === product.id);

  if(existing){

    if(existing.cartQuantity < product.quantity){

      existing.cartQuantity++;

    }else{

      alert("इतनी मात्रा उपलब्ध नहीं है।");

    }

  }else{

    cart.push({

      ...product,

      cartQuantity:1

    });

  }

  renderCart();

};


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const box =
    document.getElementById("cart");

  const totalBox =
    document.getElementById("cartTotal");

  if(cart.length === 0){

    box.innerHTML =
      "Cart अभी खाली है।";

    totalBox.innerText = "0";

    return;

  }

  box.innerHTML = "";

  let total = 0;

  cart.forEach((item,index)=>{

    const itemTotal =
      item.price *
      item.cartQuantity;

    total += itemTotal;

    const div =
      document.createElement("div");

    div.className = "cart-item";

    div.innerHTML = `

      <div>

        <strong>
          ${escapeHtml(item.name)}
        </strong>

        <br>

        ₹${item.price}/kg

        <br>

        मात्रा:
        ${item.cartQuantity} kg

        <br>

        कुल:
        ₹${itemTotal}

      </div>

      <div>

        <button
          onclick="changeQuantity(${index},-1)"
        >
          −
        </button>

        <button
          onclick="changeQuantity(${index},1)"
        >
          +
        </button>

        <button
          class="remove"
          onclick="removeFromCart(${index})"
        >
          हटाएं
        </button>

      </div>

    `;

    box.appendChild(div);

  });

  totalBox.innerText =
    total.toFixed(2);

}


/* =========================
   CHANGE QUANTITY
========================= */

window.changeQuantity =
function(index,change){

  const item = cart[index];

  const newQty =
    item.cartQuantity + change;

  if(newQty <= 0){

    cart.splice(index,1);

  }else if(
    newQty <= item.quantity
  ){

    item.cartQuantity =
      newQty;

  }else{

    alert("इतनी मात्रा उपलब्ध नहीं है।");

  }

  renderCart();

};


/* =========================
   REMOVE
========================= */

window.removeFromCart =
function(index){

  cart.splice(index,1);

  renderCart();

};


/* =========================
   SELL PRODUCT
========================= */

document
.getElementById("sellForm")
.addEventListener(
"submit",
async function(event){

  event.preventDefault();

  if(!currentUser){

    alert(
      "पहले Firebase login होने दें।"
    );

    return;

  }

  const imageFile =
    document
    .getElementById("productImage")
    .files[0];

  if(!imageFile){

    alert("कृपया सामान की फोटो चुनें।");

    return;

  }

  const phone =
    document
    .getElementById("phone")
    .value
    .trim();

  if(!/^[0-9]{10}$/.test(phone)){

    alert(
      "मोबाइल नंबर 10 अंकों का होना चाहिए।"
    );

    return;

  }

  try{

    const productName =
      document
      .getElementById("productName")
      .value
      .trim();

    const category =
      document
      .getElementById("productCategory")
      .value;

    const price =
      Number(
        document
        .getElementById("price")
        .value
      );

    const quantity =
      Number(
        document
        .getElementById("quantity")
        .value
      );

    const farmer =
      document
      .getElementById("farmer")
      .value
      .trim();

    const location =
      document
      .getElementById("location")
      .value
      .trim();

    const description =
      document
      .getElementById("description")
      .value
      .trim();


    if(price <= 0 || quantity <= 0){

      alert(
        "कीमत और मात्रा सही डालें।"
      );

      return;

    }


    const fileName =
      Date.now() +
      "_" +
      imageFile.name
      .replace(/[^a-zA-Z0-9._-]/g,"_");


    const imagePath =
      "product-images/" +
      currentUser.uid +
      "/" +
      fileName;


    const imageReference =
      storageRef(
        storage,
        imagePath
      );


    await uploadBytes(
      imageReference,
      imageFile
    );


    const imageUrl =
      await getDownloadURL(
        imageReference
      );


    const productReference =
      push(ref(db,"products"));


    await set(
      productReference,
      {

        name:productName,

        category:category,

        price:price,

        quantity:quantity,

        farmer:farmer,

        phone:phone,

        location:location,

        description:description,

        imageUrl:imageUrl,

        ownerUid:currentUser.uid,

        status:"active",

        createdAt:
          Date.now()

      }
    );


    alert(
      "✅ आपका सामान सफलतापूर्वक पोस्ट हो गया।"
    );


    document
    .getElementById("sellForm")
    .reset();


    loadProducts();


  }catch(error){

    console.error(error);

    alert(
      "❌ सामान पोस्ट नहीं हुआ। Firebase Storage/Database Rules और config जांचें।"
    );

  }

});


/* =========================
   SEND ORDER
========================= */

document
.getElementById("orderForm")
.addEventListener(
"submit",
async function(event){

  event.preventDefault();

  if(!currentUser){

    alert(
      "Firebase login नहीं हुआ।"
    );

    return;

  }

  if(cart.length === 0){

    alert(
      "पहले Cart में सामान डालें।"
    );

    return;

  }


  const customerName =
    document
    .getElementById("customerName")
    .value
    .trim();

  const customerPhone =
    document
    .getElementById("customerPhone")
    .value
    .trim();

  const customerAddress =
    document
    .getElementById("customerAddress")
    .value
    .trim();


  if(
    !/^[0-9]{10}$/
    .test(customerPhone)
  ){

    alert(
      "मोबाइल नंबर 10 अंकों का होना चाहिए।"
    );

    return;

  }


  try{

    const items =
      cart.map(item=>({

        productId:item.id,

        name:item.name,

        price:item.price,

        quantity:item.cartQuantity,

        farmer:item.farmer,

        farmerPhone:item.farmerPhone,

        total:
          item.price *
          item.cartQuantity

      }));


    const total =
      items.reduce(
        (sum,item)=>
          sum + item.total,
        0
      );


    const orderReference =
      push(ref(db,"orders"));


    await set(
      orderReference,
      {

        customerUid:
          currentUser.uid,

        customerName:
          customerName,

        customerPhone:
          customerPhone,

        customerAddress:
          customerAddress,

        items:items,

        total:total,

        status:"pending",

        createdAt:
          Date.now()

      }
    );


    alert(
      "✅ आपका ऑर्डर भेज दिया गया है।"
    );


    cart = [];

    renderCart();

    document
    .getElementById("orderForm")
    .reset();


  }catch(error){

    console.error(error);

    alert(
      "❌ ऑर्डर नहीं भेजा गया। Firebase Database Rules जांचें।"
    );

  }

});


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* =========================
   SEARCH
========================= */

document
.getElementById("searchInput")
.addEventListener(
"input",
loadProducts
);

document
.getElementById("categoryFilter")
.addEventListener(
"change",
loadProducts
);


/* =========================
   START
========================= */

loginUser();

</script>

</body>
</html>
